class: NotebookJobRecord
serverOnly: true
table: poodle_notebook_job
fields:
  id: UuidValue?, defaultPersist=random_v7
  ownerUserId: UuidValue
  notebookId: UuidValue?
  sourceId: UuidValue?
  jobType: String
  status: String, default='queued'
  attempts: int, default=0
  leaseToken: String?
  leaseExpiresAt: DateTime?
  requestKey: String
  privatePayload: String?
  failureCode: String?
  createdAt: DateTime, default=now
  updatedAt: DateTime, default=now
indexes:
  poodle_notebook_job_request:
    fields: ownerUserId, requestKey
    unique: true
  poodle_notebook_job_queue:
    fields: status, createdAt
