name: Analyze

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: dart analyze --fatal-infos poodle_client poodle_flutter poodle_server poodle_worker

      - name: Check Dart package boundaries
        run: python3 tool/check_dart_boundaries.py
