name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Disposable CI databases only; never use these values outside tests.
    env:
      SERVERPOD_PASSWORD_database: 'poodle-ci-database-only'
      SERVERPOD_PASSWORD_redis: 'poodle-ci-redis-only'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc

      - name: Install dependencies
        id: dependencies
        run: flutter pub get --enforce-lockfile

      - name: Flutter tests
        working-directory: poodle_flutter
        run: flutter test --no-pub --coverage

      - name: Calendar browser regressions
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: poodle_flutter
        run: flutter test --no-pub --platform chrome test/unit/data/calendar_repository_offline_test.dart

      - name: Server tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: poodle_server
        run: dart test --coverage=coverage

      - name: Install and verify worker tools
        id: worker_tools
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-ukr ffmpeg

          for tool in python3 pdfinfo pdftotext pdftoppm tesseract ffmpeg ffprobe; do
            if ! command -v "$tool" >/dev/null; then
              echo "::error::Missing required worker command: $tool"
              exit 1
            fi
          done

          languages=$(tesseract --list-langs)
          for language in eng ukr; do
            if ! grep -Fxq "$language" <<< "$languages"; then
              echo "::error::Missing required Tesseract language: $language"
              exit 1
            fi
          done

      - name: Worker tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.worker_tools.outcome == 'success' }}
        working-directory: poodle_worker
        run: dart test --coverage=coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poodle-coverage
          path: |
            poodle_flutter/coverage/
            poodle_server/coverage/
            poodle_worker/coverage/
